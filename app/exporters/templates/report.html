<!DOCTYPE html>
<!--
    report.html — Szablon strony HTML dla raportów Finance AI Agent

    SZABLON: Python zastępuje {klucz} przez _render_html() w report_exporter.py.

    Zastępowane pola:
      {symbol}      → symbol kryptowaluty, np. "BTC"
      {report_date} → data raportu w formacie ISO, np. "2026-04-06"
      {css}         → pełna zawartość pliku report.css (wklejona dosłownie)
      {body}        → fragment HTML z treścią raportu

    Dlaczego CSS jest osadzony w <style>, a nie linkowany zewnętrznym plikiem?
    → Plik HTML musi być self-contained: można go wysłać mailem, otworzyć
      offline lub przekazać do WeasyPrint bez serwera HTTP.

    Struktura strony:
      <header>        → ciemny banner z symbolem, datą i branding
        .header-left  → badge "CRYPTO ANALYSIS" + duży symbol
        .header-right → data + opis
        .header-bar   → dolna dekoracyjna linia headera
      <main>          → karta z treścią raportu (max-width 900px)
      <footer>        → zastrzeżenie prawne
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance AI Agent — {symbol} — {report_date}</title>
    <style>{css}</style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div class="header-left">
                <!-- Mała etykieta nad symbolem -->
                <div class="header-badge">CRYPTO ANALYSIS</div>
                <!-- Główny duży napis z symbolem kryptowaluty -->
                <div class="header-symbol">{symbol}</div>
            </div>
            <div class="header-right">
                <!-- Data raportu -->
                <div class="header-date">{report_date}</div>
                <div class="header-subtitle">Finance AI Agent &nbsp;·&nbsp; Market Report</div>
            </div>
        </div>
        <!-- Kolorowy pasek akcentujący na dole headera -->
        <div class="header-bar"></div>
    </header>

    <main>
        {body}

        <footer>
            This report is for informational purposes only and does not constitute
            financial advice. Past performance is not indicative of future results.
            Generated by Finance AI Agent.
        </footer>
    </main>

</body>
</html>
